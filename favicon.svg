<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="짬짬이 그리기">
  <!-- 가족 공통 틀: 둥근 타일 + 우상단 흰 원에 네이비 시계 배지.
       그리기의 바탕색은 코랄 #E4572E(색상각 14°), 심볼은 연필입니다(PRD 12장). -->
  <rect width="100" height="100" rx="24" fill="#E4572E"/>

  <!-- 연필: 왼쪽 위를 향합니다. 오른쪽 위는 시계 배지 자리로 비웁니다. -->
  <g>
    <polygon points="71.6,86.4 32.1,46.9 44.9,34.1 84.4,73.6" fill="#FFFFFF"/>
    <polygon points="32.1,46.9 24,26 44.9,34.1" fill="#1D3557"/>
    <polygon points="71.6,86.4 65.4,80.2 78.2,67.4 84.4,73.6" fill="#1D3557"/>
    <line x1="38.5" y1="40.5" x2="78" y2="80" stroke="#E4572E" stroke-width="2.4" opacity=".55"/>
  </g>

  <!-- 시계 배지 -->
  <circle cx="76" cy="24" r="19" fill="#FFFFFF"/>
  <circle cx="76" cy="24" r="14.5" fill="none" stroke="#1D3557" stroke-width="3.5"/>
  <path d="M 76 24 L 76 15 M 76 24 L 83 24" stroke="#1D3557" stroke-width="3.5"
        stroke-linecap="round" fill="none"/>
</svg>
