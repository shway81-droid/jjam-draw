name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 그림 데이터 전수 검증(PRD 9장). 통합본이 원본과 어긋나면 여기서 멈춥니다.
      - run: npm test

      # tools/ 와 drawings/ 는 배포하지 않습니다.
      # 앱이 읽는 것은 통합본 data/drawings.json 하나입니다(PRD 11장).
      - name: 배포용 폴더 만들기
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest favicon.svg .nojekyll _site/
          cp -r css js data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
